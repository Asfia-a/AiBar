server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/ai_tavern?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tavern.entity

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

storage:
  type: ${STORAGE_TYPE:oss}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:lightshadowcity}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}

ai:
  model:
    provider: deepseek
    # 未配置 AI_API_KEY 时自动降级为本地模拟流式
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://claudex.org/v1}
    model-name: ${AI_MODEL_NAME:deepseek-v4-flash}
    context-window-size: 20
    # top_k / repetition_penalty 不是 OpenAI 标准参数，云端网关会直接 400。
    # auto=只有 base-url 指向本机/局域网（Ollama、vLLM 等）才下发；always=总是；never=从不
    extended-params: auto
  image:
    api-key: ${AI_IMAGE_API_KEY:}
    base-url: ${AI_IMAGE_BASE_URL:https://claudex.org/v1}
    model-name: ${AI_IMAGE_MODEL_NAME:gpt-image-2.5-flare-1k}
    size: "1024x1024"

# 对话按积分扣费：API total_tokens / tokens-per-point（向上取整）
billing:
  tokens-per-point: 1000

jwt:
  # 生产环境必须通过环境变量覆盖
  secret: ${JWT_SECRET:dev-only-secret-please-override-in-production}
  expiration: 86400000

security:
  exclude-paths:
    - /api/auth/**
    - /api/characters
    - /api/characters/*
    - /api/characters/hot
    - /api/characters/new
    - /api/characters/search
    - /api/characters/*/comments
    - /api/tags
    - /api/categories
    - /api/health

logging:
  level:
    com.tavern: info
